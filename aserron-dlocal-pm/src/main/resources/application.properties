server.port=8080
server.servlet.context-path=/

# Merchant Service HTTP Target URL
merchant.service.url=${MERCHANT_SERVICE_URL:http://localhost:8081/merchant/api}

# Fixer.io Configuration
fixerio.access.key=da3108ee8542ab4a0e1041c2106a72e8
fixerio.url=http://data.fixer.io/api/latest?access_key=da3108ee8542ab4a0e1041c2106a72e8

# MySQL Database Configuration with Environment Fallbacks
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dlocal_demo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dlocal_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dlocal_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57Dialect

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,scheduledtasks
management.endpoint.health.show-details=always
